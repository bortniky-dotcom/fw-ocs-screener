name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire form.css and crest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          t = p.read_text()
          t = re.sub(r'<style>.*?</style>', '<link rel="stylesheet" href="form.css" />', t, count=1, flags=re.S)
          if 'yb-crest.js' not in t:
              t = t.replace('</body>', '  <script src="yb-crest.js"></script>\n</body>', 1)
          p.write_text(t)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
